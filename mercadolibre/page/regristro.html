<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="javiera leon">
    <link rel="stylesheet" href="../static/css/style.css">
    <title>Crea tu cuenta - Mercado Libre</title>
</head>
<body class="body-registro">
    <!-- Franja amarilla superior con el logo -->
    <header class="header-registro">
        <div class="contenedor-header-registro">
            <a href="../index.html">
                <img src="../static/images/logo.png" alt="Mercado Libre">
            </a>
        </div>
    </header>

    <!-- Contenido principal -->
    <main class="main-registro">
        <h1>Crea tu cuenta y compra con envíos gratis</h1>

        <!-- Tarjeta blanca centrada -->
        <div class="tarjeta-registro">
            <button type="button" class="btn-google">
                <img src="../static/images/icono-google.png" alt="Google">
                <span>Registrarse con Google</span>
            </button>

            <div class="separador">
                <span>O ingresa tu e-mail</span>
            </div>

            <form action="../index.html" class="form-registro">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
            </form>
        </div>

        <!-- Enlace inferior para cuentas corporativas -->
        <div class="cuenta-empresa">
            <p>¿Necesitas una cuenta para tu empresa?</p>
            <a href="#">Crea una cuenta corporativa</a>
        </div>
    </main>
</body>
</html>
